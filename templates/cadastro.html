<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Seu Style</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #080b12;
            color: white;
            padding: 30px;
        }

        /* Título */

        h1 {
            text-align: center;
            color: #e3262e;
            font-size: 34px;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Área do cadastro */

        .cadastro {
            max-width: 500px;
            margin: auto;

            background-color: #111722;

            padding: 30px;

            border-radius: 12px;

            border: 1px solid #26344d;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.5);

            transition: 0.3s;
        }

        .cadastro:hover {
            border-color: #d71920;

            box-shadow:
                0 8px 25px rgba(215, 25, 32, 0.25);
        }

        /* Labels */

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            color: white;

            font-weight: bold;
        }

        /* Campos */

        input {
            width: 100%;

            padding: 11px;

            background-color: #080b12;

            color: white;

            border: 1px solid #26344d;

            border-radius: 6px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        /* Quando clicar no campo */

        input:focus {
            border-color: #d71920;

            box-shadow:
                0 0 8px rgba(215, 25, 32, 0.3);
        }

        /* Botão cadastrar */

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            background-color: #d71920;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            transition: 0.2s;
        }

        button:hover {
            background-color: #a90f15;

            transform: scale(1.02);
        }

        /* Voltar */

        .voltar {
            text-align: center;

            margin-top: 25px;
        }

        .voltar a {
            display: inline-block;

            padding: 10px 18px;

            background-color: #071a36;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            border: 1px solid #26344d;

            font-weight: bold;

            transition: 0.2s;
        }

        .voltar a:hover {
            background-color: #d71920;

            border-color: #d71920;
        }

    </style>
</head>

<body>

    <h1>👤 Cadastro de Cliente</h1>

    <div class="cadastro">

        <form action="/cadastrar" method="POST">

            <label>Nome:</label>

            <input
                type="text"
                name="nome"
                required
            >


            <label>CPF:</label>

            <input
                type="text"
                name="cpf"
                required
            >


            <label>Email:</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Telefone:</label>

            <input
                type="text"
                name="telefone"
                required
            >


            <label>Endereço:</label>

            <input
                type="text"
                name="endereco"
                required
            >


            <button type="submit">
                Cadastrar Cliente
            </button>

        </form>


        <div class="voltar">

            <a href="/">
                ← Voltar para a loja
            </a>

        </div>

    </div>

</body>

</html>
