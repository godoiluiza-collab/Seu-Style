<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Seu Style</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #0b1f3a;
        }

        .cadastro {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px #ccc;
        }

        label {
            display: block;
            margin-top: 12px;
            color: #0b1f3a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0b1f3a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163b6d;
        }

        .voltar {
            text-align: center;
            margin-top: 20px;
        }

        .voltar a {
            color: #0b1f3a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>Cadastro de Cliente</h1>

    <div class="cadastro">

        <form action="/cadastrar" method="POST">

            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>CPF:</label>
            <input type="text" name="cpf" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Telefone:</label>
            <input type="text" name="telefone" required>

            <label>Endereço:</label>
            <input type="text" name="endereco" required>

            <button type="submit">Cadastrar</button>

        </form>

        <div class="voltar">
            <a href="/">← Voltar para a loja</a>
        </div>

    </div>

</body>

</html>
